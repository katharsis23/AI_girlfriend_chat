[project]
name = "ai-girlfriend"
version = "0.1.0"
description = ""
authors = [
    {name = "katharsis23",email = "daniklv2006@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "pyside6 (>=6.12.0,<7.0.0)"
]

[project.optional-dependencies]
qt = ["PySide6"]
rag = []

[tool.poetry]
packages = [{include = "ai_girlfriend", from = "src"}]
# Ship the QML documents (and the singleton qmldir) inside the wheel so the
# desktop UI works after `pip install .[qt]` (see docs/ui_spec.md §10.1).
include = [
    "ai_girlfriend/ui/qml/**/*.qml",
    "ai_girlfriend/ui/qml/qmldir",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "invoke (>=3.0.3,<4.0.0)",
    "pre-commit (>=4.0.0,<5.0.0)"
]



# =========== Ruff Config ============
[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

# Cleaned up list of relevant exclusions
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "venv",
    # Reference template for the QML UI; uses intentional Qt/camelCase
    # conventions and is not part of the shipped package.
    "ui_qml_template",
]

[tool.ruff.lint]
# Selected Rules optimized for FastAPI & Modern Python:
# E/W = pycodestyle, F = Pyflakes, I = isort, B = Bugbear, UP = PyUpgrade
# N = PEP8 Naming, ASYNC = Asyncio linting, RUF = Ruff-specific rules
select = ["E", "W", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]
ignore = [
    "E501",   # Ignore line-too-long (handled cleanly by ruff format)
    "RUF012",
    # Ambiguous unicode: the app ships Ukrainian (Cyrillic) copy and uses
    # typographic dashes in docstrings, both intentional.
    "RUF001",
    "RUF002",
    "RUF003",
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in init files (common for package exports)
"__init__.py" = ["F401"]
# Allow asset statements and ignore naming conventions in unit tests
"tests/**/*.py" = ["S101", "N802", "N806"]
# QML/PySide integration layer: camelCase names are required for properties
# and slots to be visible from QML, so PEP8 naming rules do not apply.
"src/ai_girlfriend/ui/**/*.py" = ["N802", "N815"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Automatically formats Python snippets hidden inside your docstrings!
docstring-code-format = true
docstring-code-line-length = "dynamic"


# +======== Pytest ==============
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast tests without I/O",
    "contract: providers conform to their contracts",
    "integration: pipeline with real dependencies (SQLite, Ollama)",
]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
